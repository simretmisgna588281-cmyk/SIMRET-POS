<style>
/* ============ SIMRET POS v1.4.0 - STYLE (edit colours here) ============ */
:root{--bg:#f4f6fb;--sf:#ffffff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--ac:#2563eb;--ac2:color-mix(in srgb,var(--ac) 13%,var(--sf));--ok:#16a34a;--wn:#d97706;--er:#dc2626;--sh:0 6px 24px rgba(15,23,42,.08);--r:16px}

*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(1000px 420px at 8% -10%,var(--ac2),transparent 60%),var(--bg);color:var(--tx);min-height:100vh}
h1,h2,h3{margin:0}
h2{font-size:18px;margin-bottom:10px}
h3{font-size:15px;margin:14px 0 8px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--bd);background:var(--sf);border-radius:12px;padding:8px 14px;transition:transform .12s,box-shadow .15s,background .15s}
button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.12)}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.5;cursor:not-allowed}
button.p{background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 60%,#7c3aed));color:#fff;border-color:transparent;font-weight:600}
button.g{background:var(--ok);border-color:transparent;color:#fff;font-weight:700}
button.d{background:var(--er);border-color:transparent;color:#fff}
button.s{padding:4px 10px;font-size:13px;border-radius:10px}
input,select,textarea{width:100%;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:9px 12px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac2)}
input[type=checkbox]{width:auto;accent-color:var(--ac)}
input[type=color]{padding:2px;height:40px;width:70px}
textarea{min-height:74px;resize:vertical}
label{display:block;font-size:12.5px;color:var(--mu);margin:0 0 4px;font-weight:600}
.f{margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 140px}
.row>.n{flex:0 0 auto}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.mu{color:var(--mu)}.sm{font-size:12.5px}.r{text-align:right}.b{font-weight:700}
.ok{color:var(--ok)}.er{color:var(--er)}.wn{color:var(--wn)}
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:8px 14px;background:color-mix(in srgb,var(--sf) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);box-shadow:0 2px 18px rgba(15,23,42,.07);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:42px;max-width:110px;object-fit:contain;border-radius:8px}
.brand h1{font-size:18px;font-weight:800;line-height:1.1;background:linear-gradient(90deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#7c3aed));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{color:var(--mu);display:block;font-size:12px}
nav{display:flex;gap:6px;overflow-x:auto;flex:1;padding:2px}

nav button.on{background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 60%,#7c3aed));color:#fff;border-color:transparent}
.who{display:flex;gap:6px;align-items:center}
main{padding:14px;max-width:1500px;margin:0 auto}
.pos{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,400px);gap:14px;align-items:start}
.pos>*{min-width:0}
@media(max-width:900px){.pos{grid-template-columns:minmax(0,1fr)}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0}
.chips button{white-space:nowrap;border-radius:999px;padding:5px 12px;font-size:13px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pc{text-align:left;padding:12px;border-radius:16px;display:flex;flex-direction:column;gap:4px;min-height:92px}
.pc:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,0,0,.16);border-color:var(--ac)}
.pc b{font-size:14px;line-height:1.2}
.pc .pr{color:var(--ac);font-weight:800}
.pc.out{opacity:.45}
.pc.lw{border-color:var(--wn)}
.cart{position:sticky;top:70px;max-height:calc(100vh - 84px);overflow-y:auto;overscroll-behavior:contain}
.cl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 0;border-bottom:1px dashed var(--bd)}
.qt{display:flex;align-items:center;gap:4px}

.qt button{padding:2px 9px}
.tot div{display:flex;justify-content:space-between;padding:2px 0}
.tot .gt{font-size:24px;font-weight:800;color:var(--ac);border-top:2px solid var(--bd);margin-top:6px;padding-top:6px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kp div{background:linear-gradient(145deg,var(--sf),var(--ac2));border:1px solid var(--bd);border-radius:18px;padding:14px;box-shadow:var(--sh)}
.kp b{display:block;font-size:22px;color:var(--ac)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mu);padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--bd);vertical-align:middle}
tr:hover td{background:var(--ac2)}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--ac2);color:var(--ac);font-weight:600}
.tag.er{background:color-mix(in srgb,var(--er) 15%,var(--sf));color:var(--er)}
.tag.wn{background:color-mix(in srgb,var(--wn) 18%,var(--sf));color:var(--wn)}
.tag.ok{background:color-mix(in srgb,var(--ok) 15%,var(--sf));color:var(--ok)}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:10px}
.bars div{flex:1;background:linear-gradient(180deg,var(--ac),color-mix(in srgb,var(--ac) 50%,#7c3aed));border-radius:8px 8px 0 0;min-height:2px;position:relative}
.bars span{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--mu);white-space:nowrap}
.ov{position:fixed;inset:0;background:rgba(2,6,23,.55);z-index:60;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
.mb{position:relative;background:var(--sf);border:1px solid var(--bd);border-radius:22px;padding:20px;width:100%;max-width:560px;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.mb.w{max-width:900px}
.mb .x{position:absolute;top:10px;right:10px;border-radius:50%;padding:4px 10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:90;display:none;max-width:90vw}
#alb{position:fixed;top:72px;right:12px;left:12px;max-width:430px;margin-left:auto;z-index:70;display:flex;flex-direction:column;gap:8px}
#alb:empty{display:none}
.ab{display:flex;gap:10px;align-items:flex-start;background:var(--sf);border:1px solid var(--bd);border-left:6px solid var(--er);border-radius:16px;padding:10px 12px;box-shadow:0 12px 32px rgba(0,0,0,.25);animation:sl .3s}
.ab.ky{border-left-color:var(--ac)}
@keyframes sl{from{transform:translateY(-12px);opacity:0}}
.login{max-width:380px;margin:8vh auto;text-align:center}
.login img{max-height:90px;max-width:220px;object-fit:contain;margin-bottom:8px}
.login input{text-align:center;font-size:22px;letter-spacing:6px}
.sp{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){.sp{grid-template-columns:1fr}}
.pvw{background:#e5e7eb;border-radius:14px;padding:14px;overflow:auto;text-align:center}
.logoBox{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logoBox img{max-height:70px;max-width:200px;border:1px dashed var(--bd);border-radius:10px;padding:4px;background:#fff}
@media print{header,nav,#alb,#toast{display:none!important}}
.wl{max-height:120px;max-width:70%;object-fit:contain;margin-bottom:6px}.welcome{text-align:center}.brand{position:fixed;bottom:3px;left:8px;font:700 10px Arial;letter-spacing:2px;opacity:.45;pointer-events:none;z-index:5}.ab.ex{border-color:var(--wn)}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
main{min-width:0}.chips{max-width:100%}
.catpop{position:absolute;z-index:40;left:0;top:100%;margin-top:4px;flex-wrap:wrap;overflow:auto;max-height:55vh;width:min(560px,92vw);padding:10px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.catpop[hidden]{display:none}
html,body{max-width:100%;overflow-x:clip}
.pos{grid-template-columns:minmax(0,1fr) clamp(280px,34vw,380px)!important}
.grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
@media(max-width:700px){.pos{grid-template-columns:minmax(0,1fr)!important}.pos .cart{order:-1;position:static}}
.side{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:16px 10px;background:color-mix(in srgb,var(--sf) 90%,transparent);border-right:1px solid var(--bd)}
.side nav{flex-direction:column;overflow:visible;flex:none;gap:6px}
.side nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border-radius:12px;padding:11px 12px;font-size:15px}
.side nav .ic{width:24px;text-align:center}.content{min-width:0}.content header{justify-content:flex-end}
@media(max-width:900px){.shell{display:block}.side{position:sticky;top:0;z-index:31;height:auto;flex-direction:row;align-items:center;padding:6px 10px;border-right:0;border-bottom:1px solid var(--bd)}.side .brand h1,.side .brand small{display:none}.side nav{flex-direction:row;overflow-x:auto;flex:1}.side nav button{width:auto;padding:8px 12px}.side nav .ic{width:auto}.content header{position:static;justify-content:flex-start}}
@media print{.side{display:none!important}.shell{display:block}}

/* ============ SIMRET POS v1.6 - MODERN STYLE (colours come from --ac, change it in Settings) ============ */
:root{--sh:0 1px 2px rgba(15,23,42,.05),0 12px 32px -14px rgba(15,23,42,.22);--g2:color-mix(in srgb,var(--ac) 52%,#8b5cf6)}
html[data-theme=dark]{--bg:#070b14;--sf:#0f172a;--bd:#1f2b44;--mu:#8da0bd;--sh:0 1px 2px rgba(0,0,0,.45),0 18px 44px -18px rgba(0,0,0,.75)}
body{background:radial-gradient(900px 460px at 0% -8%,color-mix(in srgb,var(--ac) 17%,transparent),transparent 62%),radial-gradient(760px 420px at 100% 0%,color-mix(in srgb,#8b5cf6 13%,transparent),transparent 60%),var(--bg);background-attachment:fixed}
h2{font-weight:800;letter-spacing:-.01em}
.card{border-radius:22px;background:linear-gradient(180deg,color-mix(in srgb,var(--sf) 96%,var(--ac) 4%),var(--sf));box-shadow:var(--sh)}
button{border-radius:14px;font-weight:600}
button.p{background:linear-gradient(135deg,var(--ac),var(--g2));box-shadow:0 10px 22px -10px color-mix(in srgb,var(--ac) 80%,transparent)}
button.g{background:linear-gradient(135deg,#16a34a,#0d9488);box-shadow:0 10px 22px -10px rgba(22,163,74,.7)}
input,select,textarea{border-radius:14px}
.side{background:linear-gradient(180deg,color-mix(in srgb,var(--sf) 90%,var(--ac) 10%),var(--sf));box-shadow:6px 0 30px -18px rgba(15,23,42,.35)}
.side nav button{border-radius:14px;font-weight:600;border-color:transparent;background:transparent}
.side nav button:hover:not(.on){background:var(--ac2);transform:none;box-shadow:none}
.side nav button.on{background:linear-gradient(135deg,var(--ac),var(--g2));color:#fff;box-shadow:0 12px 26px -12px var(--ac)}
header{border-radius:0 0 18px 18px}
.pc{border-radius:20px;border:1px solid var(--bd);background:linear-gradient(160deg,var(--sf),color-mix(in srgb,var(--sf) 90%,var(--ac) 10%))}

tr:hover td{background:color-mix(in srgb,var(--sf) 94%,var(--ac) 6%)}
.tag{border-radius:999px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}

.seg{display:inline-flex;gap:3px;background:var(--ac2);padding:3px;border-radius:13px}

.lc{width:100%;height:auto;display:block}.lc text{fill:var(--mu);font-size:11px}.lc .gl{stroke:var(--bd);stroke-width:1}

.pc{position:relative}

function saveProd(f){const id=f.dataset.id,v=i=>$("#"+i).value.trim(),code=v("pf_code"),pc=v("pf_pc")||nextPC();
 if(D.products.some(p=>p.id!=id&&p.pc&&String(p.pc).toLowerCase()==pc.toLowerCase())){toast("Another product already uses this P.Code");return}

function saveStock(){const t=$("#sk_t").value,p=prod($("#sk_p").value),q=+$("#sk_q").value,nc=$("#sk_c").value,note=$("#sk_n").value.trim();if(!p||isNaN(q))return;
 let delta=t=="in"?q:t=="out"?-q:rd(q-p.stock);if(t=="out"&&q>p.stock){toast("Cannot remove more than current stock");return}
 p.stock=r3(p.stock+delta);if(t=="in"&&nc!=="")p.cost=+nc||p.cost;D.moves.push({id:uid(),t:Date.now(),pid:p.id,name:p.name,qty:delta,type:t,note,user:me.name});save();chkLow();PREV=lowMap();render();toast("Stock updated: "+p.name+" = "+fq(p.stock))}

function voidSale(id){const s=D.sales.find(x=>x.id==id);if(!s||s.void)return;const cr=(D.credits||[]).find(x=>x.saleId==id);if(cr&&(+cr.paid||0)>0){toast("This credit sale has payments recorded. Resolve the credit account before voiding.");return}if(!confirm("Void receipt "+rno(s)+"? Stock will be returned."))return;if(cr){cr.status="Void";cr.balance=0} s.void=true;for(const i of s.items){const p=prod(i.pid);if(p){p.stock=r3(p.stock+(i.bq??i.qty));D.moves.push({id:uid(),t:Date.now(),pid:p.id,name:p.name,qty:i.bq??i.qty,type:"void",note:rno(s),user:me.name})}}save();renderSTab();toast("Sale voided")}

function niceMax(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}

 [["receipt","print","printer","80mm","58mm","cut","margin","qr","whatsapp","logo"],"Receipt and printer","Open <b>Settings → Receipt designer</b>. Choose 58 mm, 80 mm, A4 or <b>Other printer</b> and type its width. If the last digit is cut, raise the <b>Right margin</b>. You can make the shop name and TOTAL bigger, add a black band, set the QR size and position, and add your WhatsApp order QR."],
 [["efris","ura","tax","vat","tin"],"EFRIS / URA","In <b>Sales</b> press <b>EFRIS export</b> to get an Excel file for your accountant (invoices, goods, tax). It is not sent to URA automatically. Direct EFRIS e-invoicing needs a URA connection that is set up separately."],
 [["staff","cashier","pin","password","user","role","boss"],"Staff and PINs","Open <b>Settings → Staff & PINs</b>. Add a name, username, a 4 to 8 digit PIN and a role (Cashier, Stock receiver, Credit approval or Owner). Use a different PIN for each person."],
 [["backup","restore","erase","delete all","data"],"Backup and data","Open <b>Settings → Data</b>. Download a backup often and keep it safe. Erasing everything needs the boss password and cannot be undone."],
 [["colour","color","theme","style","dark","light","accent"],"Colour and style","Open <b>Settings → Shop profile</b> and tap a colour theme, or press <b>Use my logo colour</b>. The moon button at the top switches dark and light."],
 [["licence","license","activate","expire","device"],"Licence","Your licence belongs to this shop. If it is about to expire, contact SIMRET to renew it before the date. The licence is shown at the bottom of Settings."],
 [["internet","offline","sync","cloud","many devices","counter"],"Offline and many counters","The POS keeps selling when the internet is off and syncs when it returns. With cloud sync, prices and stock changed at the office show on every counter within seconds."],
 [["expense","expenses","goods taken","own use"],"Expenses","Open <b>Expenses</b> to record money spent (rent, transport, salaries) and goods taken or damaged. They reduce your profit in the reports."]];
const HELP_TIPS=["How do I close my shift?","How do I make a promotion?","My receipt is cut on the right","How do I order many products?"];
function helpAnswer(q){const t=" "+String(q).toLowerCase().replace(/[^a-z0-9 ]+/g," ")+" ";let best=null,bs=0;for(const e of HELP_KB){let sc=0;for(const k of e[0])if(t.includes(" "+k+" ")||(k.length>3&&t.includes(k)))sc+=k.includes(" ")?3:2;if(sc>bs){bs=sc;best=e}}
 return best?`<b>${best[1]}</b><br>${best[2]}`:"I do not know that one yet. Try other words, for example: <i>shift, receipt, promotion, order stock, backup, credit, shop value</i>."}
function helpOpen(){modal(`<h2>&#10067; SIMRET Helper</h2><div id="hlp" class="hlp"><div class="hb bot">Hello! Ask me how to do something in SIMRET POS.</div></div><div class="row" style="gap:6px;margin:8px 0">${HELP_TIPS.map(t=>`<button class="s n" data-act="helpask" data-q="${esc(t)}">${esc(t)}</button>`).join("")}</div><form data-form="help" style="display:flex;gap:8px"><input id="hq" placeholder="Type your question..." autocomplete="off"><button class="p n">Ask</button></form>`);setTimeout(()=>{const e=$("#hq");if(e)e.focus()},60)}
function helpSay(q){const h=$("#hlp");if(!h)return;h.insertAdjacentHTML("beforeend",`<div class="hb me">${esc(q)}</div><div class="hb bot">${helpAnswer(q)}</div>`);h.scrollTop=h.scrollHeight}
document.addEventListener("submit",e=>{const f=e.target.closest("form[data-form=help]");if(!f)return;e.preventDefault();const i=$("#hq"),q=i.value.trim();if(q)helpSay(q);i.value=""});
(function(){const b=document.createElement("button");b.id="helpfab";b.dataset.act="helpopen";b.title="SIMRET Helper";b.textContent="?";document.body.appendChild(b)})();
/* ===================== END v1.6 PORTED ===================== */

/* ---------- start ---------- */
licStart();
</script>
